<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вторая пранама-мантра Шриле Бхактисиддханте Сарасвати: слоги деванагари</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .full-verse {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }
    .full-verse .line {
      font-style: italic;
      color: #1e3a8a;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .letter-large {
      font-size: 64px;
      line-height: 1;
      font-weight: 600;
      color: #1e3a8a;
      margin: 10px 0 12px 0;
    }
    .translit {
      display: block;
      font-size: 28px;
      color: #334155;
      margin-bottom: 16px;
      font-weight: normal;
    }
    .example-word {
      font-weight: bold;
      color: #0563bb;
      margin-bottom: 4px;
    }
    .meaning-small {
      color: #555;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .hint {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
    .lotus-icon {
      display: block;
      width: 50px;
      height: 50px;
      margin: 0 auto 0.5rem;
    }
    .divider {
      display: block;
      width: 100%;
      max-width: 350px;
      margin: 1.5rem auto;
    }
    .debug {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <img src="lotus.svg" alt="" class="lotus-icon">
  <h1>Вторая пранама-мантра Шриле Бхактисиддханте Сарасвати</h1>
  <p class="subtitle">Тренажёр слогов деванагари</p>

  <div class="full-verse">
    <div class="line">माधुर्योज्ज्वल-प्रेमाढ्य-श्रीरूपानुग-भक्तिद</div>
    <div class="line">श्रीगौर-करुणाशक्ति-विग्रहाय नमोऽस्तु ते ॥</div>
    <div class="line">мадхурьйоджджвала-премадхйа-шри-рупануга-бхактид</div>
    <div class="line">шри-гаура-каруна-шакти-виграхайа намо'сту те ॥</div>
  </div>

  <img src="divider.svg" alt="" class="divider">

  <button id="showBtn">Следующий слог</button>

  <div class="card" id="card">
    <div class="letter-large" id="letterDeva"></div>
    <span class="translit" id="letterTranslit"></span>
    <div class="example-word" id="exampleWord"></div>
    <div class="meaning-small" id="meaningSmall"></div>
    <div class="hint" id="hintText"></div>
  </div>

  <div class="debug" id="debugInfo"></div>

  <script>
    const syllables = [
      {
        deva: 'मा',
        translit: 'mā',
        example: 'माधुर्य (mādhurya)',
        meaning: '«ма» долгое',
        hint: '«म» + знак долгого «а» = долгое «ма». Этот знак ставится справа и удлиняет «а». Начало слова «мадхурья» — «супружеская любовь».'
      },
      {
        deva: 'धु',
        translit: 'dhu',
        example: 'माधुर्य (mādhurya)',
        meaning: '«дху»',
        hint: '«ध» (звонкое придыхательное «дх») + знак короткого «у» = короткое «дху». Этот знак пишется снизу.'
      },
      {
        deva: 'र्यो',
        translit: 'ryo',
        example: 'माधुर्य (mādhurya)',
        meaning: '«рьё» (р + й + о)',
        hint: '«र» — «р» с вирамой (без гласного), затем «य» («й») и матра «о» сверху-справа: «र्य» + знак «о» = «рйо». Это один слог, разбивать его на «र्य» и «ओ» нельзя: «о» здесь не отдельная буква, а знак при «य».'
      },
      {
        deva: 'ज्ज्व',
        translit: 'jjva',
        example: 'उज्ज्वल (ujjvala)',
        meaning: '«джджва» (дж + дж + в)',
        hint: 'Сложная лигатура из трёх букв: «ज» + «ज» + «व». Читается плотно: «джджва». Слово «уджджвала» — «сияющая, пылающая».'
      },
      {
        deva: 'ल',
        translit: 'la',
        example: 'उज्ज्वल (ujjvala)',
        meaning: '«ла»',
        hint: 'Простое «ल» = «ла». Завершает слово «уджджвала».'
      },
      {
        deva: 'प्रे',
        translit: 'pre',
        example: 'प्रेम (prema)',
        meaning: '«пре» (п + р + е)',
        hint: '«प» + «र» дают лигатуру «प्र» («пр»), матра «е» сверху даёт «е»: «пре». Начало слова «према» — «любовь».'
      },
      {
        deva: 'मा',
        translit: 'mā',
        example: 'प्रेमाढ्य (premāḍhya)',
        meaning: '«ма» долгое',
        hint: '«म» + знак долгого «а» = долгое «ма». Здесь знак долгого «а» — это слияние: «према» + «ādhya» → «premāḍhya».'
      },
      {
        deva: 'ढ्य',
        translit: 'ḍhya',
        example: 'आढ्य (āḍhya)',
        meaning: '«дхья» (ḍh + й)',
        hint: 'Лигатура «ढ» + «य». «ढ» — церебральное придыхательное «ḍh» (язык загнут к нёбу), по-русски близко к «дхья». Слово «адхья» — «богатая, исполненная».'
      },
      {
        deva: 'श्री',
        translit: 'śrī',
        example: 'श्रीरूपानुग (śrī-rūpānuga)',
        meaning: '«шри»',
        hint: 'Классическая лигатура: «श» («ш») + «र» («р») + знак долгого «и». Читается «шри».'
      },
      {
        deva: 'रू',
        translit: 'rū',
        example: 'रूप (rūpa)',
        meaning: '«ру» долгое',
        hint: '«र» + знак долгого «у» = долгое «ру». Этот знак пишется снизу.'
      },
      {
        deva: 'पा',
        translit: 'pā',
        example: 'रूपानुग (rūpānuga)',
        meaning: '«па» долгое',
        hint: '«प» + знак долгого «а» = долгое «па».'
      },
      {
        deva: 'नु',
        translit: 'nu',
        example: 'अनुग (anuga)',
        meaning: '«ну»',
        hint: '«न» + знак короткого «у» = короткое «ну».'
      },
      {
        deva: 'ग',
        translit: 'ga',
        example: 'अनुग (anuga)',
        meaning: '«га»',
        hint: 'Простое «ग» = «га». Завершает слово «шри-рупа-ануга» — «следующий за Рупой Госвами».'
      },
      {
        deva: 'भक्',
        translit: 'bhak',
        example: 'भक्ति (bhakti)',
        meaning: '«бхак»',
        hint: '«भ» («бх») + «क» («к» с вирамой, без гласного) = «бхак».'
      },
      {
        deva: 'ति',
        translit: 'ti',
        example: 'भक्ति (bhakti)',
        meaning: '«ти»',
        hint: '«त» + знак короткого «и» = короткое «ти». Этот знак пишется слева от буквы, но читается после неё.'
      },
      {
        deva: 'द',
        translit: 'da',
        example: 'भक्तिद (bhakti-da)',
        meaning: '«да»',
        hint: 'Простое «द» = «да» — «дающий». Всё слово «бхакти-да» — «дарующий преданное служение».'
      },
      {
        deva: 'श्री',
        translit: 'śrī',
        example: 'श्रीगौर (śrī-gaura)',
        meaning: '«шри»',
        hint: 'Та же лигатура «श्री» — «шри», начало слова «шри-гаура».'
      },
      {
        deva: 'गौ',
        translit: 'gau',
        example: 'गौर (gaura)',
        meaning: '«гау»',
        hint: '«ग» + знак «ау» = дифтонг «гау». Этот знак ставится сверху справа.'
      },
      {
        deva: 'र',
        translit: 'ra',
        example: 'गौर (gaura)',
        meaning: '«ра»',
        hint: 'Простое «र» = «ра». Слово «гаура» — «золотистый».'
      },
      {
        deva: 'क',
        translit: 'ka',
        example: 'करुणा (karuṇā)',
        meaning: '«ка»',
        hint: 'Простое «क» = «ка», начало слова «каруна» — «милость».'
      },
      {
        deva: 'रु',
        translit: 'ru',
        example: 'करुणा (karuṇā)',
        meaning: '«ру»',
        hint: '«र» + знак короткого «у» = короткое «ру».'
      },
      {
        deva: 'णा',
        translit: 'ṇā',
        example: 'करुणा (karuṇā)',
        meaning: '«на» церебральное, долгое',
        hint: '«ण» — церебральное «ṇ» (язык у нёба), знак долгого «а» делает гласную долгой: «ṇā», на слух — «на».'
      },
      {
        deva: 'शक्',
        translit: 'śak',
        example: 'शक्ति (śakti)',
        meaning: '«шак»',
        hint: '«श» («ш») + «क» («к» с вирамой) = «шак».'
      },
      {
        deva: 'ति',
        translit: 'ti',
        example: 'शक्ति (śakti)',
        meaning: '«ти»',
        hint: '«त» + знак короткого «и» = «ти». Слово «шакти» — «энергия».'
      },
      {
        deva: 'वि',
        translit: 'vi',
        example: 'विग्रह (vigraha)',
        meaning: '«ви»',
        hint: '«व» + знак короткого «и» = короткое «ви». Этот знак стоит слева.'
      },
      {
        deva: 'ग्र',
        translit: 'gra',
        example: 'विग्रह (vigraha)',
        meaning: '«гра»',
        hint: 'Лигатура «ग» + «र» = «гр»; вместе с «а» получается «гра».'
      },
      {
        deva: 'हा',
        translit: 'hā',
        example: 'विग्रह (vigraha)',
        meaning: '«ха» долгое',
        hint: '«ह» («х») + знак долгого «а» = долгое «ха».'
      },
      {
        deva: 'य',
        translit: 'ya',
        example: 'विग्रहाय (vigrahāya)',
        meaning: '«йа»',
        hint: '«य» = «йа». Это окончание дательного падежа «-āya»: «виграхайа» — «олицетворённому».'
      },
      {
        deva: 'न',
        translit: 'na',
        example: 'नमः (namaḥ)',
        meaning: '«на»',
        hint: 'Простое «न» = «на», начало слова «намах» — «поклоны». В записи «नमोऽस्तु» оно слито с «асту».'
      },
      {
        deva: 'मो',
        translit: 'mo',
        example: 'नमो (namo)',
        meaning: '«мо»',
        hint: '«म» + знак «о» = «мо». Висарга перед «а» превращается в «о»: «namaḥ astu» → «namo’stu».'
      },
      {
        deva: 'ऽ',
        translit: '\'',
        example: 'नमोऽस्तु (namo\'stu)',
        meaning: 'авагра́ха — апостроф',
        hint: '«ऽ» — авагра́ха: знак, который показывает, что начальное «а» слова «асту» выпало после «о». Сам он не произносится, в транслитерации пишется апострофом.'
      },
      {
        deva: 'स्तु',
        translit: 'stu',
        example: 'अस्तु (astu)',
        meaning: '«сту» (с + т + у)',
        hint: 'Лигатура «स» + «त» + знак короткого «у» = «сту». Этот знак пишется снизу. Слово «асту» — «пусть будет».'
      },
      {
        deva: 'ते',
        translit: 'te',
        example: 'ते (te)',
        meaning: '«те» — «тебе»',
        hint: '«त» + знак «е» = «те». Этот знак ставится сверху. Короткое местоимение «тебе».'
      }
    ];

    const btn = document.getElementById('showBtn');
    const card = document.getElementById('card');
    const letterDeva = document.getElementById('letterDeva');
    const letterTranslit = document.getElementById('letterTranslit');
    const exampleWord = document.getElementById('exampleWord');
    const meaningSmall = document.getElementById('meaningSmall');
    const hintText = document.getElementById('hintText');

    let currentIndex = 0;

    btn.addEventListener('click', () => {
      if (currentIndex >= syllables.length) {
        currentIndex = 0;
        alert('Прошли все слоги! Можно начать заново.');
      }
      const s = syllables[currentIndex];

      letterDeva.textContent = s.deva;
      letterTranslit.textContent = s.translit;
      exampleWord.textContent = s.example;
      meaningSmall.textContent = s.meaning;
      hintText.textContent = s.hint;

      card.style.display = 'block';
      btn.textContent = 'Ещё один слог';
      currentIndex++;

      document.getElementById('debugInfo').textContent =
        'Слог ' + currentIndex + ' из ' + syllables.length;
    });
  </script>
</body>
</html>
