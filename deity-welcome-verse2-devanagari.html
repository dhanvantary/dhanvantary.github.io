<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приветствие Божеств: слоги деванагари (куплет 2)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .letter-large {
      font-size: 64px;
      line-height: 1;
      font-weight: 600;
      color: #1e3a8a;
      margin: 10px 0 12px 0;
    }
    .translit {
      display: block;
      font-size: 28px;
      color: #334155;
      margin-bottom: 16px;
      font-weight: normal;
    }
    .example-word {
      font-weight: bold;
      color: #0563bb;
      margin-bottom: 4px;
    }
    .meaning-small {
      color: #555;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .hint {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
  </style>
</head>
<body>
  <h1>Приветствие Божеств</h1>
  <p class="subtitle">Куплет 2 — тренажёр слогов деванагари</p>
  <button id="showBtn">Следующий слог</button>

  <div class="card" id="card">
    <div class="letter-large" id="letterDeva"></div>
    <span class="translit" id="letterTranslit"></span>
    <div class="example-word" id="exampleWord"></div>
    <div class="meaning-small" id="meaningSmall"></div>
    <div class="hint" id="hintText"></div>
  </div>

  <script>
    const syllables = [
      {
        deva: 'अं',
        translit: 'aṁ',
        example: 'अंगानि (aṅgāni)',
        meaning: 'носовой звук + “а”',
        hint: 'Точка сверху (анунасика) даёт носовой призвук. Читай как “ам” с лёгким носовым оттенком, не как чистое “м”.'
      },
      {
        deva: 'ग',
        translit: 'ga',
        example: 'अंगानि (aṅgāni)',
        meaning: 'звонкий “г”',
        hint: 'В санскрите “ग” — звонкий, ближе к мягкому “га”, без сильного взрыва.'
      },
      {
        deva: 'ा',
        translit: 'ā',
        example: 'अंगानि (aṅgāni)',
        meaning: 'долгий гласный “а”',
        hint: 'Знак под буквой (агра) делает “а” долгим. Читай “гаа” (протяжно).'
      },
      {
        deva: 'नि',
        translit: 'ni',
        example: 'अंगानि (aṅgāni)',
        meaning: '“ни”',
        hint: '“न” + знак “ि” = “ни”. Знак слева даёт короткое “и”.'
      },
      {
        deva: 'य',
        translit: 'ya',
        example: 'यस्य (yasya)',
        meaning: '“йа”',
        hint: 'Читается как мягкое “йа”, почти как “я”.'
      },
      {
        deva: 'स',
        translit: 'sa',
        example: 'यस्य (yasya)',
        meaning: 'зубной “с”',
        hint: 'Это обычный “са”, не шипящий, а зубной, как в слове “сад”.'
      },
      {
        deva: '्य',
        translit: 'ya',
        example: 'यस्य (yasya)',
        meaning: 'знак “йа” после “с”',
        hint: 'Вирама (маленькая точка) убирает “а”, и дальше идёт “йа”. Получается “сья”.'
      },
      {
        deva: 'सक',
        translit: 'saka',
        example: 'सकल (sakala)',
        meaning: 'сочетание “сака”',
        hint: 'Здесь “स” + “क” сливаются в один слог. Читай плавно: “сака”.'
      },
      {
        deva: 'ल',
        translit: 'la',
        example: 'सकल (sakala)',
        meaning: 'мягкий “ла”',
        hint: 'Санскритское “ल” мягче русского “л”, ближе к “ля”.'
      },
      {
        deva: 'इ',
        translit: 'i',
        example: 'इन्द्रिय (indriya)',
        meaning: 'короткий гласный “и”',
        hint: 'Короткое “и”, не тяни. В начале слова это отдельная буква.'
      },
      {
        deva: 'न्',
        translit: 'n',
        example: 'इन्द्रिय (indriya)',
        meaning: '“н” с вирамой',
        hint: 'Маленькая точка снизу (вирама) убирает гласный “а”. Читай просто “н”.'
      },
      {
        deva: 'द्र',
        translit: 'dra',
        example: 'इन्द्रिय (indriya)',
        meaning: 'слияние “д + р”',
        hint: 'В санскрите “द” и “र” часто сливаются в “дра”. Читай как один слог.'
      },
      {
        deva: 'िय',
        translit: 'iya',
        example: 'इन्द्रिय (indriya)',
        meaning: '“ия”',
        hint: 'Знак “ि” + “य” дают “ия”. Это частый способ писать “ya” после гласного.'
      },
      {
        deva: 'वृ',
        translit: 'vṛ',
        example: 'वृत्तिमंति (vṛttimanti)',
        meaning: '“вṛ” (ретрофлексный гласный)',
        hint: 'Сочетание “व” + знак “ृ” читается как “вṛ”. Это особый звук, похожий на “ври” с коротким “р”.'
      },
      {
        deva: 'त्',
        translit: 't',
        example: 'वृत्तिमंति (vṛttimanti)',
        meaning: '“т” с вирамой',
        hint: 'Точка снизу убирает “а”. Читай просто “т”.'
      },
      {
        deva: 'ति',
        translit: 'ti',
        example: 'वृत्तिमंति (vṛttimanti)',
        meaning: '“ти”',
        hint: '“त” + знак “ि” = “ти”. Знак слева даёт короткое “и”.'
      },
      {
        deva: 'पाँ',
        translit: 'pāṁ',
        example: 'पाँति (pānti)',
        meaning: '“па” с носовым знаком',
        hint: 'Носовой знак (точка сверху) делает звук назализованным. Читай как “паам”.'
      },
      {
        deva: 'कल',
        translit: 'kala',
        example: 'कलयन्ति (kalayanti)',
        meaning: '“кала”',
        hint: 'Простое сочетание “ка + ла”. Читай плавно, без паузы.'
      },
      {
        deva: 'न्ति',
        translit: 'nti',
        example: 'कलयन्ति (kalayanti)',
        meaning: 'окончание “нти”',
        hint: 'Частое окончание для 3-го лица мн. числа. Читай слитно: “нти”.'
      },
      {
        deva: 'चि',
        translit: 'ci',
        example: 'चिरम् (ciram)',
        meaning: '“чи”',
        hint: '“च” — это мягкий “ч”, ближе к “чи”.'
      },
      {
        deva: 'रम्',
        translit: 'ram',
        example: 'चिरम् (ciram)',
        meaning: '“рам”',
        hint: '“र” — мягкое “ра”, “म्” — “м” с точкой (назализация).'
      },
      {
        deva: 'जग',
        translit: 'jaga',
        example: 'जगन्ति (jaganti)',
        meaning: '“джага”',
        hint: '“ज” — звонкий мягкий “дж”, не как в английском “j”, а мягче.'
      },
      {
        deva: 'न्ति',
        translit: 'nti',
        example: 'जगन्ति (jaganti)',
        meaning: 'окончание “нти”',
        hint: 'Опять то же окончание: “нти”.'
      },
      {
        deva: 'आ',
        translit: 'ā',
        example: 'आनंद (ānanda)',
        meaning: 'долгий “а”',
        hint: 'Долгий гласный. Читай протяжно: “аа”.'
      },
      {
        deva: 'नं',
        translit: 'naṁ',
        example: 'आनंद (ānanda)',
        meaning: '“на” с носовым знаком',
        hint: 'Носовой призвук. Читай как “наам”.'
      },
      {
        deva: 'द',
        translit: 'da',
        example: 'आनंद (ānanda)',
        meaning: 'звонкий “д”',
        hint: 'Зубной звонкий “да”, мягче русского “д”.'
      },
      {
        deva: 'चिन्',
        translit: 'cin',
        example: 'चिन्मय (cinmaya)',
        meaning: '“чин”',
        hint: '“च” + “ि” + “न्” = “чин”. Точка убирает “а” после “н”.'
      },
      {
        deva: 'मय',
        translit: 'maya',
        example: 'चिन्मय (cinmaya)',
        meaning: '“майя”',
        hint: 'Простое “ма + йа”.'
      },
      {
        deva: 'सत्',
        translit: 'sat',
        example: 'सत् (sat)',
        meaning: '“сат”',
        hint: '“स” + “त्” = “сат”. Точка убирает гласный после “т”.'
      },
      {
        deva: 'उज्',
        translit: 'uj',
        example: 'उज्जवल (ujjvala)',
        meaning: '“удж”',
        hint: 'Двойная “дж” из-за удвоения. Читай как усиленный “удж”.'
      },
      {
        deva: 'ज्व',
        translit: 'jva',
        example: 'उज्जवल (ujjvala)',
        meaning: '“джва”',
        hint: 'Сложное сочетание “дж + ва”. Читай слитно.'
      },
      {
        deva: 'ल',
        translit: 'la',
        example: 'उज्जवल (ujjvala)',
        meaning: '“ла”',
        hint: 'Мягкий “ла”.'
      },
      {
        deva: 'वि',
        translit: 'vi',
        example: 'विग्रहस्य (vigrahasya)',
        meaning: '“ви”',
        hint: '“व” + “ि” = “ви”. Знак слева даёт “и”.'
      },
      {
        deva: 'ग्र',
        translit: 'gra',
        example: 'विग्रहस्य (vigrahasya)',
        meaning: '“гра”',
        hint: 'Слияние “ग” + “र” = “гра”. Читай одним слогом.'
      },
      {
        deva: 'ह',
        translit: 'ha',
        example: 'विग्रहस्य (vigrahasya)',
        meaning: 'глухой “ха”',
        hint: 'Лёгкий выдох, не напрягай голос.'
      },
      {
        deva: 'स्य',
        translit: 'sya',
        example: 'विग्रहस्य (vigrahasya)',
        meaning: '“сья”',
        hint: '“स” + вирама + “य” = “сья”.'
      },
      {
        deva: 'गो',
        translit: 'go',
        example: 'गोविन्दम् (Govindam)',
        meaning: '“го”',
        hint: 'Простое “го”.'
      },
      {
        deva: 'वि',
        translit: 'vi',
        example: 'गोविन्दम् (Govindam)',
        meaning: '“ви”',
        hint: 'Как и раньше, “व” + “ि” = “ви”.'
      }
    ]; 

    const btn = document.getElementById('showBtn');
    const card = document.getElementById('card');
    const letterDeva = document.getElementById('letterDeva');
    const letterTranslit = document.getElementById('letterTranslit');
    const exampleWord = document.getElementById('exampleWord');
    const meaningSmall = document.getElementById('meaningSmall');
    const hintText = document.getElementById('hintText');

    let currentIndex = 0;

    btn.addEventListener('click', () => {
      if (currentIndex >= syllables.length) {
        currentIndex = 0;
        alert('Прошли все слоги! Можно начать заново.');
      }
      const s = syllables[currentIndex];

      letterDeva.textContent = s.deva;
      letterTranslit.textContent = s.translit;
      exampleWord.textContent = s.example;
      meaningSmall.textContent = s.meaning;
      hintText.textContent = s.hint;

      card.style.display = 'block';
      btn.textContent = 'Ещё один слог';
      currentIndex++;
    });
  </script>
</body>
</html>
