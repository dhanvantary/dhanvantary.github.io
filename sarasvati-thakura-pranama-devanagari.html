<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пранама-мантра Шриле Бхактисиддханте Сарасвати: слоги деванагари</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .full-verse {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }
    .full-verse .line {
      font-style: italic;
      color: #1e3a8a;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .letter-large {
      font-size: 64px;
      line-height: 1;
      font-weight: 600;
      color: #1e3a8a;
      margin: 10px 0 12px 0;
    }
    .translit {
      display: block;
      font-size: 28px;
      color: #334155;
      margin-bottom: 16px;
      font-weight: normal;
    }
    .example-word {
      font-weight: bold;
      color: #0563bb;
      margin-bottom: 4px;
    }
    .meaning-small {
      color: #555;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .hint {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
    .lotus-icon {
      display: block;
      width: 50px;
      height: 50px;
      margin: 0 auto 0.5rem;
    }
    .divider {
      display: block;
      width: 100%;
      max-width: 350px;
      margin: 1.5rem auto;
    }
    .debug {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <img src="lotus.svg" alt="" class="lotus-icon">
  <h1>Пранама-мантра Шриле Бхактисиддханте Сарасвати</h1>
  <p class="subtitle">Тренажёр слогов деванагари</p>

  <div class="full-verse">
    <div class="line">нама ом вишну-падайа кришна-прештхайа бху-тале</div>
    <div class="line">шримате бхактисиддханта-сарасвати-ити намине</div>
  </div>

  <img src="divider.svg" alt="" class="divider">

  <button id="showBtn">Следующий слог</button>

  <div class="card" id="card">
    <div class="letter-large" id="letterDeva"></div>
    <span class="translit" id="letterTranslit"></span>
    <div class="example-word" id="exampleWord"></div>
    <div class="meaning-small" id="meaningSmall"></div>
    <div class="hint" id="hintText"></div>
  </div>

  <div class="debug" id="debugInfo"></div>

  <script>
    const syllables = [
      {
        deva: 'न',
        translit: 'na',
        example: 'नम (nama)',
        meaning: '«на»',
        hint: 'Обычный зубной «н», начинает слово «нама» — «почтительный поклон».'
      },
      {
        deva: 'म',
        translit: 'ma',
        example: 'नम (nama)',
        meaning: '«ма»',
        hint: 'Обычный «м», завершает слово «нама».'
      },
      {
        deva: 'ओं',
        translit: 'oṁ',
        example: 'ओं (oṁ)',
        meaning: 'священный слог «ом» с анусварой',
        hint: '«ओ» — самостоятельная гласная «о», а точка сверху (анусвара) даёт носовой призвук «м».'
      },
      {
        deva: 'वि',
        translit: 'vi',
        example: 'विष्णु (viṣṇu)',
        meaning: '«ви»',
        hint: '«व» + «ि» = короткое «ви», начинает имя «Вишну».'
      },
      {
        deva: 'ष्णु',
        translit: 'ṣṇu',
        example: 'विष्णु (viṣṇu)',
        meaning: 'конъюнкт «шну»',
        hint: '«ष» (церебральное «ш») + «ण» (церебральное «н») + «у» сливаются в плотный кластер «шну».'
      },
      {
        deva: 'पा',
        translit: 'pā',
        example: 'पादाय (pādāya)',
        meaning: 'долгое «па»',
        hint: '«प» + долгое «ा» = «па-а», начинает слово «падайа» — «стопам».'
      },
      {
        deva: 'दा',
        translit: 'dā',
        example: 'पादाय (pādāya)',
        meaning: 'долгое «да»',
        hint: '«द» + долгое «ा» = «да-а».'
      },
      {
        deva: 'य',
        translit: 'ya',
        example: 'पादाय (pādāya)',
        meaning: '«йа»',
        hint: 'Завершает слово «падайа» — дательный падеж «стопам».'
      },
      {
        deva: 'कृ',
        translit: 'kṛ',
        example: 'कृष्ण (kṛṣṇa)',
        meaning: 'слог с ретрофлексным гласным «кри»',
        hint: '«क» + особый гласный знак «ृ» (ṛ) дают непривычное для русского слуха «кри».'
      },
      {
        deva: 'ष्ण',
        translit: 'ṣṇa',
        example: 'कृष्ण (kṛṣṇa)',
        meaning: 'конъюнкт «шна»',
        hint: '«ष» + «ण» сливаются в «шна», завершают имя «Кришна».'
      },
      {
        deva: 'प्रे',
        translit: 'pre',
        example: 'प्रेष्ठाय (preṣṭhāya)',
        meaning: 'лигатура «пре»',
        hint: '«प» + вирама + «र» образуют лигатуру «пре» (репха «р» встраивается в согласную), плюс знак «े» = «пре».'
      },
      {
        deva: 'ष्ठा',
        translit: 'ṣṭhā',
        example: 'प्रेष्ठाय (preṣṭhāya)',
        meaning: 'конъюнкт «штха» (долгий)',
        hint: '«ष» (церебральное «ш») + «ठ» (церебральное придыхательное «тх») + долгое «а» сливаются в «штха».'
      },
      {
        deva: 'य',
        translit: 'ya',
        example: 'प्रेष्ठाय (preṣṭhāya)',
        meaning: '«йа»',
        hint: 'Завершает слово «прештхайа» — «тому, кто очень дорог».'
      },
      {
        deva: 'भू',
        translit: 'bhū',
        example: 'भू-तले (bhū-tale)',
        meaning: 'придыхательное долгое «бху»',
        hint: '«भ» — «б» с лёгким выдохом, плюс долгое «ू» = «бху», «земля».'
      },
      {
        deva: 'त',
        translit: 'ta',
        example: 'तले (tale)',
        meaning: '«та»',
        hint: 'Обычный зубной «т», начинает слово «тале» — «на».'
      },
      {
        deva: 'ले',
        translit: 'le',
        example: 'तले (tale)',
        meaning: '«ле»',
        hint: '«ल» + «े» = долгое «ле», завершает «бху-тале» — «на этой земле».'
      },
      {
        deva: 'श्री',
        translit: 'śrī',
        example: 'श्रीमते (śrīmate)',
        meaning: 'почтительная приставка «шри»',
        hint: '«श्» + «री» (лигатура с «р») — та же уважительная приставка, что и в других молитвах.'
      },
      {
        deva: 'म',
        translit: 'ma',
        example: 'श्रीमते (śrīmate)',
        meaning: '«ма»',
        hint: 'Обычный «м» со стандартным «а».'
      },
      {
        deva: 'ते',
        translit: 'te',
        example: 'श्रीमते (śrīmate)',
        meaning: '«те»',
        hint: 'Завершает слово «шримате» — «достославному».'
      },
      {
        deva: 'भक्',
        translit: 'bhak',
        example: 'भक्तिसिद्धान्त (bhaktisiddhānta)',
        meaning: '«бхак» с вирамой',
        hint: '«भ» (придыхательное «б») + «क्» (вирама убирает «а») дают «бхак» — начало слова «бхакти», «преданное служение».'
      },
      {
        deva: 'ति',
        translit: 'ti',
        example: 'भक्तिसिद्धान्त (bhaktisiddhānta)',
        meaning: '«ти»',
        hint: '«त» + «ि» = короткое «ти», завершает «бхакти».'
      },
      {
        deva: 'सि',
        translit: 'si',
        example: 'भक्तिसिद्धान्त (bhaktisiddhānta)',
        meaning: '«си»',
        hint: '«स» + «ि» = короткое «си», начинает слово «сиддханта» — «совершенство, итог».'
      },
      {
        deva: 'द्धा',
        translit: 'ddhā',
        example: 'भक्तिसिद्धान्त (bhaktisiddhānta)',
        meaning: 'конъюнкт «дхха» (долгий)',
        hint: '«द» + вирама + «ध» (придыхательное «д») + долгое «ा» сливаются в «дхха» — двойное усиленное «д».'
      },
      {
        deva: 'न्त',
        translit: 'nta',
        example: 'भक्तिसिद्धान्त (bhaktisiddhānta)',
        meaning: 'конъюнкт «нта»',
        hint: '«न» + вирама + «त» сливаются в «нта», завершают слово «сиддханта» — «доведённый до совершенства».'
      },
      {
        deva: 'स',
        translit: 'sa',
        example: 'सरस्वती (sarasvatī)',
        meaning: '«са»',
        hint: 'Зубной «с» со стандартным «а», начинает имя «Сарасвати».'
      },
      {
        deva: 'र',
        translit: 'ra',
        example: 'सरस्वती (sarasvatī)',
        meaning: '«ра»',
        hint: 'Короткое звонкое «ра».'
      },
      {
        deva: 'स्व',
        translit: 'sva',
        example: 'सरस्वती (sarasvatī)',
        meaning: 'конъюнкт «сва»',
        hint: '«स» + вирама + «व» сливаются в «сва».'
      },
      {
        deva: 'ती',
        translit: 'tī',
        example: 'सरस्वती (sarasvatī)',
        meaning: 'долгое «ти»',
        hint: '«त» + долгое «ी» = «ти-и», завершает имя «Сарасвати» — богини знания и речи.'
      },
      {
        deva: 'इ',
        translit: 'i',
        example: 'इति (iti)',
        meaning: 'самостоятельная краткая «и»',
        hint: 'Отдельная буква для гласного «и» в начале слова (не знак, а самостоятельная гласная).'
      },
      {
        deva: 'ति',
        translit: 'ti',
        example: 'इति (iti)',
        meaning: '«ти»',
        hint: 'Завершает слово «ити» — «так, таким образом».'
      },
      {
        deva: 'ना',
        translit: 'nā',
        example: 'नामिने (nāmine)',
        meaning: 'долгое «на»',
        hint: '«न» + долгое «ा» = «на-а», начинает слово «намине» — «носящему имя».'
      },
      {
        deva: 'मि',
        translit: 'mi',
        example: 'नामिने (nāmine)',
        meaning: '«ми»',
        hint: '«म» + «ि» = короткое «ми».'
      },
      {
        deva: 'ने',
        translit: 'ne',
        example: 'नामिने (nāmine)',
        meaning: '«не»',
        hint: '«न» + «े» = долгое «не», завершает слово «намине».'
      }
    ];

    const btn = document.getElementById('showBtn');
    const card = document.getElementById('card');
    const letterDeva = document.getElementById('letterDeva');
    const letterTranslit = document.getElementById('letterTranslit');
    const exampleWord = document.getElementById('exampleWord');
    const meaningSmall = document.getElementById('meaningSmall');
    const hintText = document.getElementById('hintText');

    let currentIndex = 0;

    btn.addEventListener('click', () => {
      if (currentIndex >= syllables.length) {
        currentIndex = 0;
        alert('Прошли все слоги! Можно начать заново.');
      }
      const s = syllables[currentIndex];

      letterDeva.textContent = s.deva;
      letterTranslit.textContent = s.translit;
      exampleWord.textContent = s.example;
      meaningSmall.textContent = s.meaning;
      hintText.textContent = s.hint;

      card.style.display = 'block';
      btn.textContent = 'Ещё один слог';
      currentIndex++;

      document.getElementById('debugInfo').textContent =
        'Слог ' + currentIndex + ' из ' + syllables.length;
    });
  </script>
</body>
</html>
