<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приветствие Божеств: слоги деванагари (куплет 1)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-top: 20px;
      display: none;
      text-align: center;
    }
    .letter-large {
      font-size: 64px;
      line-height: 1;
      font-weight: 600;
      color: #1e3a8a;
      margin: 10px 0 12px 0;
    }
    .translit {
      display: block;
      font-size: 28px;
      color: #334155;
      margin-bottom: 16px;
      font-weight: normal;
    }
    .example-word {
      font-weight: bold;
      color: #0563bb;
      margin-bottom: 4px;
    }
    .meaning-small {
      color: #555;
      font-size: 14px;
      margin-bottom: 18px;
    }
    .hint {
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
  </style>
</head>
