        hint: 'Обычный зубной «т».'

        meaning: 'конъюнкт «нья»',

      },
      {

        translit: 'kṛ',
        example: 'कृष्ण (kṛṣṇa)',

        hint: 'Тот же особый гласный «ृ», что и раньше в имени «Кришна».'
      },
      {
        deva: 'ष्ण',
        translit: 'ṣṇa',

      },
      {

        example: 'पादान् (pādān)',

      },
      {

        translit: 'dān',

      {

        example: 'ललिता (lalitā)',

      {

        deva: 'ता',
        translit: 'tā',

      {

        meaning: '«ча» — «и» (финальное)',
        hint: 'Последнее соединительное «и» в этой молитве: оно закрывает круг поклона всем участникам лилы.'
      }
    ];

    const btn = document.getElementById('showBtn');
    const card = document.getElementById('card');
    const letterDeva = document.getElementById('letterDeva');
    const letterTranslit = document.getElementById('letterTranslit');
    const exampleWord = document.getElementById('exampleWord');
    const meaningSmall = document.getElementById('meaningSmall');
    const hintText = document.getElementById('hintText');

    let currentIndex = 0;

    btn.addEventListener('click', () => {
      if (currentIndex >= syllables.length) {
        currentIndex = 0;
        alert('Прошли все слоги! Можно начать заново.');
      }
      const s = syllables[currentIndex];

      letterDeva.textContent = s.deva;
      letterTranslit.textContent = s.translit;
      exampleWord.textContent = s.example;
      meaningSmall.textContent = s.meaning;
      hintText.textContent = s.hint;

      card.style.display = 'block';
      btn.textContent = 'Ещё один слог';
      currentIndex++;

      document.getElementById('debugInfo').textContent =
        'Слог ' + currentIndex + ' из ' + syllables.length;
    });
  </script>
