<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приветствие Божеств: слово дня (куплет 1)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;

      margin-bottom: 4px;

      text-align: center;
      color: #666;

      margin-bottom: 20px;
    }
    .full-verse {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      text-align: center;
    }
    .full-verse .line {
      font-style: italic;
      color: #1e3a8a;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-top: 24px;
      display: none;
    }
    .sanskrit {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      color: #1e3a8a;
      text-align: center;
      margin: 8px 0;
    }

      display: block;

      font-weight: bold;
      margin-bottom: 12px;

      line-height: 1.4;

    .context-en {
      color: #555;
      border-color: #4f46e5;
    }
    .thought-ru, .thought-en {
      color: #333;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .thought-en {
      color: #444;
      font-style: italic;
    }
    button {
      width: 100%;
      padding: 18px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
    .debug {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    .lotus-icon {
      display: block;
      width: 50px;
      height: 50px;
      margin: 0 auto 0.5rem;
    }
    .divider {
      display: block;
      width: 100%;
      max-width: 350px;
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>
  <img src="lotus.svg" alt="" class="lotus-icon">
  <h1>Приветствие Божеств</h1>
  <p class="subtitle">Куплет 1: карточки слов</p>

  <div class="full-verse">
    <div class="line">венум кванантам аравинда-далайатакшам</div>
    <div class="line">бархаватамсам аситамбуда-сундарангам</div>
    <div class="line">кандарпа-коти-каманийа-вишеша-шобхам</div>
    <div class="line">Говиндам ади-пурушам там ахам бхаджами</div>
  </div>

  <img src="divider.svg" alt="" class="divider">

  <audio id="verseAudio" src="YAmuna_Devi_Dasi_SHrila_Prabkhupada_-_Govindam_adi_purusham_privetstvie_bozhest.mp3" controls style="width: 100%; margin-bottom: 20px;"></audio>

  <button id="showBtn">Слово дня</button>

  <div class="card" id="wordCard">
    <div class="sanskrit" id="sanskritWord"></div>
    <span class="translit" id="translitWord"></span>
    <div class="meaning" id="meaningWord"></div>

    <div class="context-ru" id="contextRu"></div>
    <div class="context-en" id="contextEn"></div>

    <div class="thought-ru" id="thoughtRu"></div>
    <div class="thought-en" id="thoughtEn"></div>
  </div>

  <div class="debug" id="debugInfo"></div>

  <script>
    const words = [
      {
        sanskrit: 'वेणुम्',
        translit: 'Vēṇum',
        meaning: 'флейта (музыкальный инструмент)',
        contextRu: 'Образ флейты Кришны — это звук, который зовёт душу домой.',
        contextEn: 'The image of Krishna’s flute is a sound that calls the soul home.',
        thoughtRu: 'Сегодня послушай любой спокойный звук — шум реки, ветер, пение птиц. Представь, что этот звук тоже зовёт к чему-то важному внутри тебя.',
        thoughtEn: 'Today, listen to any calm sound — the murmur of a river, the wind, birdsong. Imagine that this sound is also calling you toward something important within.'
      },
      {
        sanskrit: 'क्वणन्तम्',
        translit: 'Kvaṇantam',
        meaning: 'играющего / издающего звук',
        contextRu: 'Часто встречается в описаниях Кришны: Он играет на флейте, и весь мир замирает от этого звука.',
        contextEn: 'This often appears in descriptions of Krishna: He plays the flute, and the whole world falls still at the sound.',
        thoughtRu: 'Иногда самое сильное действие — это не слова и не дела, а просто присутствие и звук, который отзывается в сердце.',
        thoughtEn: 'Sometimes the strongest action isn’t words or deeds, but simply presence and a sound that resonates in the heart.'
      },
      {
        sanskrit: 'अरविन्द',
        translit: 'Aravinda',
        meaning: 'лотос',
        contextRu: 'Лотос — символ чистоты: он растёт из грязи, но остаётся чистым и красивым.',
        contextEn: 'The lotus is a symbol of purity: it grows out of mud yet remains clean and beautiful.',
        thoughtRu: 'Пусть сегодня тебя не тревожит “грязь” суеты и мелких обид. Держи в уме этот образ: цветок, который просто раскрывается навстречу свету.',
        thoughtEn: 'Don’t let today’s “mud” of busyness and small hurts trouble you. Hold onto this image: a flower simply opening toward the light.'
      },
      {
        sanskrit: 'दल',
        translit: 'Dala',
        meaning: 'лепесток',
        contextRu: 'Лепесток — часть целого, но именно из них складывается вся красота цветка.',
        contextEn: 'A petal is part of a whole, yet it’s the petals together that make up the flower’s full beauty.',
        thoughtRu: 'Каждый твой маленький добрый шаг — как лепесток. Сам по себе он кажется маленьким, но вместе они создают настоящую красоту.',
        thoughtEn: 'Every small kind act of yours is like a petal. Alone it seems small, but together they create real beauty.'
      },
      {
        sanskrit: 'यतक्षम्',
        translit: 'Yatakṣam',
        meaning: 'чьи глаза (букв. “имеющий глаза, подобные…”)',
        contextRu: 'В поэзии глаза сравнивают с лотосом, солнцем, молнией — чтобы передать их силу и красоту.',
        contextEn: 'In poetry, eyes are compared to a lotus, the sun, lightning — to convey their power and beauty.',
        thoughtRu: 'Когда сегодня кто-то посмотрит тебе в глаза — пусть это будет не просто взгляд, а момент, когда ты видишь человека.',
        thoughtEn: 'When someone looks into your eyes today, let it be more than a glance — a moment of truly seeing another person.'
      },
      {
        sanskrit: 'बर्ह',
        translit: 'Barha',
        meaning: 'павлинье перо',
        contextRu: 'Павлинье перо — украшение, знак красоты и лёгкости, часто украшает голову Кришны.',
        contextEn: 'The peacock feather is an ornament, a sign of beauty and lightness, often adorning Krishna’s head.',
        thoughtRu: 'Красота бывает не в большом, а в деталях. Сегодня обрати внимание на одну маленькую деталь: узор на чашке, свет на стене, улыбку прохожего.',
        thoughtEn: 'Beauty isn’t always in grand things but in details. Today notice one small detail: a pattern on a cup, light on a wall, a passerby’s smile.'
      },
      {
        sanskrit: 'वतंसम्',
        translit: 'Vaṭamsam',
        meaning: 'украшенную голову (букв. “тот, чья голова с…”)',
        contextRu: 'Украшение головы — знак почёта и красоты, образ величия и изящества.',
        contextEn: 'An adorned head is a mark of honor and beauty, an image of majesty and grace.',
        thoughtRu: 'Представь, что сегодня ты идёшь с “украшенной головой” — не буквально, а внутренне: с достоинством, спокойствием и лёгкой улыбкой.',
        thoughtEn: 'Imagine that today you carry an “adorned head” — not literally, but inwardly: with dignity, calm, and a light smile.'
      },
      {
        sanskrit: 'असिताम्बुद',
        translit: 'Asitāmbuda',
        meaning: 'тёмно‑грозовая туча',
        contextRu: 'Поэтический образ: тёмная туча, полная дождя, — символ силы, тайны и грядущего обновления.',
        contextEn: 'A poetic image: a dark, rain-laden cloud — a symbol of power, mystery, and coming renewal.',
        thoughtRu: 'Если день кажется тяжёлым — вспомни этот образ: туча не вечна, а дождь приносит рост.',
        thoughtEn: 'If the day feels heavy, remember this image: the cloud isn’t eternal, and the rain brings growth.'
      },
      {
        sanskrit: 'सुन्दर',
        translit: 'Sundara',
        meaning: 'прекрасный, красивый',
        contextRu: 'Одно из любимых слов в санскритской поэзии — им описывают и природу, и божественное.',
        contextEn: 'One of the favorite words in Sanskrit poetry, used to describe both nature and the divine.',
        thoughtRu: 'Ищи сегодня что-то прекрасное: строчку в книге, луч солнца, доброе слово.',
        thoughtEn: 'Look for something beautiful today: a line in a book, a ray of sunlight, a kind word.'
      },
      {
        sanskrit: 'अङ्गम्',
        translit: 'Aṅgam',
        meaning: 'тело, члены тела',
        contextRu: 'Слово напоминает о целостности: всё связано, каждый элемент важен.',
        contextEn: 'The word recalls wholeness: everything is connected, every part matters.',
        thoughtRu: 'Прислушайся сегодня к своему телу: к дыханию, к шагам, к усталости. Пусть это будет не критика, а забота.',
        thoughtEn: 'Today pay attention to your body — your breath, your steps, your tiredness. Let this be care, not criticism.'
      },
      {
        sanskrit: 'कन्दर्प',
        translit: 'Kandarpa',
        meaning: 'бог любви',
        contextRu: 'Кандарпа — персонификация любви и влечения, образ силы, которая движет миром.',
        contextEn: 'Kandarpa is the personification of love and attraction, an image of the force that moves the world.',
        thoughtRu: 'Любовь — это не только большое чувство, но и маленькие проявления: вовремя сказанное “спасибо”, чашка чая для близкого.',
        thoughtEn: 'Love isn’t only a grand feeling but also small expressions: a timely “thank you,” a cup of tea for someone dear.'
      },
      {
        sanskrit: 'कोटि',
        translit: 'Koṭi',
        meaning: 'десятки миллионов, огромное множество',
        contextRu: 'Этим словом подчёркивают бесконечность, неисчислимость — например, бесчисленные качества Господа.',
        contextEn: 'This word emphasizes infinity, countlessness — for example, the Lord’s innumerable qualities.',
        thoughtRu: 'Не пытайся сегодня сделать всё. Вспомни это слово: “коти” — огромное множество. Пусть твой день будет про одно-два дела, но сделанных с вниманием.',
        thoughtEn: 'Don’t try to do everything today. Remember this word: “koti” — a vast multitude. Let your day be about one or two things done with attention.'
      },
      {
        sanskrit: 'कामनीय',
        translit: 'Kāmāniya',
        meaning: 'желанный, очаровательный',
        contextRu: 'То, что притягивает взгляд и сердце, вызывает искреннее чувство.',
        contextEn: 'That which draws the eye and the heart, evoking genuine feeling.',
        thoughtRu: 'Что сегодня по-настоящему желанно твоему сердцу? Пусть это будет не про “надо”, а про “хочу”.',
        thoughtEn: 'What does your heart truly desire today? Let it be about “want,” not just “should.”'
      },
      {
        sanskrit: 'विशेष',
        translit: 'Viśeṣa',
        meaning: 'особый, исключительный',
        contextRu: 'Этим словом выделяют что-то уникальное, то, что стоит особняком.',
        contextEn: 'This word marks something unique, something that stands apart.',
        thoughtRu: 'Сегодня ты можешь сделать один маленький “вишеша”-шаг: не как обычно, а чуть лучше, чуть внимательнее.',
        thoughtEn: 'Today you can take one small “special” step — not as usual, but a little better, a little more attentive.'
      },
      {
        sanskrit: 'शोभम्',
        translit: 'Śobham',
        meaning: 'красота, сияние',
        contextRu: 'Сияние — не только свет, но и внутренняя сила, которая делает образ завершённым.',
        contextEn: 'Radiance is not just light but an inner strength that completes the image.',
        thoughtRu: 'Пусть сегодня твоё сияние — это спокойствие и доброе слово. Даже тихий свет виден в темноте.',
        thoughtEn: 'Let your radiance today be calm and a kind word. Even a quiet light is visible in the dark.'
      },
      {
        sanskrit: 'गोविन्दम्',
        translit: 'Govindam',
        meaning: 'Говинда (имя Кришны)',
        contextRu: 'Говинда — тот, кто радует коров и землю, образ милости и заботы о мире.',
        contextEn: 'Govinda is the one who brings joy to the cows and the earth, an image of mercy and care for the world.',
        thoughtRu: 'Когда слышишь это имя, пусть оно напоминает: есть что-то большее, чем суета дня.',
        thoughtEn: 'When you hear this name, let it remind you: there is something greater than the day’s busyness.'
      },
      {
        sanskrit: 'आदि',
        translit: 'Ādi',
        meaning: 'изначальный',
        contextRu: 'Указывает на источник, начало, корень всего.',
        contextEn: 'It points to the source, the beginning, the root of everything.',
        thoughtRu: 'Вспомни сегодня своё “ади” — то, с чего всё началось: первую книгу, первый урок, первую мысль, которая тебя вдохновила.',
        thoughtEn: 'Remember today your own “adi” — the beginning of it all: the first book, the first lesson, the first thought that inspired you.'
      },
      {
        sanskrit: 'पुरुषम्',
        translit: 'Puruṣam',
        meaning: 'личность, Господь',
        contextRu: 'Пуруша — не просто человек, а высшая Личность, источник всего.',
        contextEn: 'Purusha is not merely a person but the Supreme Personality, the source of everything.',
        thoughtRu: 'Сегодня пусть твоё внимание будет к людям: услышать, понять, поддержать.',
        thoughtEn: 'Today let your attention turn to people: to listen, to understand, to support.'
      },
      {
        sanskrit: 'तम्',
        translit: 'Tam',
        meaning: 'Его',
        contextRu: 'Короткое слово, которое связывает нас с высшим: “Его милость”, “Его путь”.',
        contextEn: 'A short word that connects us to the Supreme: “His mercy,” “His path.”',
        thoughtRu: 'Пусть сегодня ты будешь не только про “я”, но и про “Его” — про что-то большее.',
        thoughtEn: 'Let today be not only about “I,” but also about “Him” — about something greater.'
      },
      {
        sanskrit: 'अहम्',
        translit: 'Aham',
        meaning: 'я (вечное “я”, не эго)',
        contextRu: '«Aham ātmā…» — “Я — Атма, пребывающий в сердце каждого” (БГ 10.20).',
        contextEn: '“Aham ātmā…” — “I am the Atma dwelling in the heart of every being” (Bhagavad-gita 10.20).',
        thoughtRu: 'Когда говоришь “я”, вспомни не про эго, а про вечное внутри.',
        thoughtEn: 'When you say “I,” remember not the ego, but the eternal within.'
      },
      {
        sanskrit: 'भजामि',
        translit: 'Bhajāmi',
        meaning: 'поклоняюсь, служу',
        contextRu: 'Бхаджами — это не обязательно ритуал, а состояние сердца: служить с любовью и вниманием.',
        contextEn: 'Bhajami doesn’t have to be a ritual — it’s a state of the heart: serving with love and attention.',
        thoughtRu: 'Служение — это тоже про маленькие дела: поддержать, помочь, просто побыть рядом.',
        thoughtEn: 'Service, too, is about small things: supporting, helping, simply being present.'
      }
    ];

    let currentIndex = -1;

    function showNextWord() {
      currentIndex = (currentIndex + 1) % words.length;
      const w = words[currentIndex];

      document.getElementById('sanskritWord').textContent = w.sanskrit;
      document.getElementById('translitWord').textContent = w.translit;
      document.getElementById('meaningWord').textContent = w.meaning;
      document.getElementById('contextRu').textContent = w.contextRu;
      document.getElementById('contextEn').textContent = w.contextEn;
      document.getElementById('thoughtRu').textContent = w.thoughtRu;
      document.getElementById('thoughtEn').textContent = w.thoughtEn;

      document.getElementById('wordCard').style.display = 'block';
      document.getElementById('debugInfo').textContent =
        'Слово ' + (currentIndex + 1) + ' из ' + words.length;
    }

    document.getElementById('showBtn').addEventListener('click', showNextWord);
  </script>
</body>
</html>
