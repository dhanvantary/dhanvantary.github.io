      <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приветствие Божеств: слово дня (куплет 1)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fdfbf7;
      color: #222;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .full-verse {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      text-align: center;
    }
    .full-verse .line {
      font-style: italic;
      color: #1e3a8a;
      font-size: 16px;
      line-height: 1.6;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-top: 24px;
      display: none;
    }
    .sanskrit {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
      color: #1e3a8a;
      text-align: center;
      margin: 8px 0;
    }
    .translit {
      display: block;
      color: #475569;
      margin: 6px 0 12px 0;
      text-align: center;
      font-style: italic;
    }
    .meaning {
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }
    .context {
      font-style: italic;
      color: #555;
      margin-bottom: 14px;
      padding-left: 10px;
      border-left: 3px solid #388e3c;
    }
    .thought {
      color: #333;
      line-height: 1.5;
    }
    button {
      width: 100%;
      padding: 18px;
      background: #1e3a8a;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #254a9e;
    }
  </style>
</head>
<body>
  <h1>Приветствие Божеств</h1>
  <p class="subtitle">Куплет 1: карточки слов</p>

  <div class="full-verse">
    <div class="line">венум кванантам аравинда-далайатакшам</div>
    <div class="line">бархаватамсам аситамбуда-сундарангам</div>
    <div class="line">кандарпа-коти-каманийа-вишеша-шобхам</div>
    <div class="line">Говиндам ади-пурушам там ахам бхаджами</div>
  </div>

  <audio id="verseAudio" src="YAmuna_Devi_Dasi_SHrila_Prabkhupada_-_Govindam_adi_purusham_privetstvie_bozhest.mp3" controls style="width: 100%; margin-bottom: 20px;"></audio>

  <button id="showBtn">Слово дня</button>

  <div class="card" id="wordCard">
    <div class="sanskrit" id="sanskritWord"></div>
    <span class="translit" id="translitWord"></span>
    <div class="meaning" id="meaningWord"></div>
    <div class="context" id="contextWord"></div>
    <div class="thought" id="thoughtWord"></div>
  </div>

  <script>
    const words = [
      {
        sanskrit: 'वेणुम्',
        translit: 'Vēṇum',
        meaning: 'флейта (музыкальный инструмент)',
        context: 'Образ флейты Кришны — это звук, который зовёт душу домой.',
        thought: 'Сегодня послушай любой спокойный звук — шум реки, ветер, пение птиц. Представь, что этот звук тоже зовёт к чему-то важному внутри тебя.'
      },
      {
        sanskrit: 'क्वणन्तम्',
        translit: 'Kvaṇantam',
        meaning: 'играющего / издающего звук',
        context: 'Часто встречается в описаниях Кришны: Он играет на флейте, и весь мир замирает от этого звука.',
        thought: 'Иногда самое сильное действие — это не слова и не дела, а просто присутствие и звук, который отзывается в сердце.'
      },
      {
        sanskrit: 'अरविन्द',
        translit: 'Aravinda',
        meaning: 'лотос',
        context: 'Лотос — символ чистоты: он растёт из грязи, но остаётся чистым и красивым.',
        thought: 'Пусть сегодня тебя не тревожит “грязь” суеты и мелких обид. Держи в уме этот образ: цветок, который просто раскрывается навстречу свету.'
      },
      {
        sanskrit: 'दल',
        translit: 'Dala',
        meaning: 'лепесток',
        context: 'Лепесток — часть целого, но именно из них складывается вся красота цветка.',
        thought: 'Каждый твой маленький добрый шаг — как лепесток. Сам по себе он кажется маленьким, но вместе они создают настоящую красоту.'
      },
      {
        sanskrit: 'यतक्षम्',
        translit: 'Yatakṣam',
        meaning: 'чьи глаза (букв. “имеющий глаза, подобные…”)',
        context: 'В поэзии глаза сравнивают с лотосом, солнцем, молнией — чтобы передать их силу и красоту.',
        thought: 'Когда сегодня кто-то посмотрит тебе в глаза — пусть это будет не просто взгляд, а момент, когда ты видишь человека.'
      },
      {
        sanskrit: 'बर्ह',
        translit: 'Barha',
        meaning: 'павлинье перо',
        context: 'Павлинье перо — украшение, знак красоты и лёгкости, часто украшает голову Кришны.',
        thought: 'Красота бывает не в большом, а в деталях. Сегодня обрати внимание на одну маленькую деталь: узор на чашке, свет на стене, улыбку прохожего.'
      },
      {
        sanskrit: 'वतंसम्',
        translit: 'Vaṭamsam',
        meaning: 'украшенную голову (букв. “тот, чья голова с…”)',
        context: 'Украшение головы — знак почёта и красоты, образ величия и изящества.',
        thought: 'Представь, что сегодня ты идёшь с “украшенной головой” — не буквально, а внутренне: с достоинством, спокойствием и лёгкой улыбкой.'
      },
      {
        sanskrit: 'असिताम्बुद',
        translit: 'Asitāmbuda',
        meaning: 'тёмно‑грозовая туча',
        context: 'Поэтический образ: тёмная туча, полная дождя, — символ силы, тайны и грядущего обновления.',
        thought: 'Если день кажется тяжёлым — вспомни этот образ: туча не вечна, а дождь приносит рост.'
      },
      {
        sanskrit: 'सुन्दर',
        translit: 'Sundara',
        meaning: 'прекрасный, красивый',
        context: 'Одно из любимых слов в санскритской поэзии — им описывают и природу, и божественное.',
        thought: 'Ищи сегодня что-то прекрасное: строчку в книге, луч солнца, доброе слово.'
      },
      {
        sanskrit: 'अङ्गम्',
        translit: 'Aṅgam',
        meaning: 'тело, члены тела',
        context: 'Слово напоминает о целостности: всё связано, каждый элемент важен.',
        thought: 'Прислушайся сегодня к своему телу: к дыханию, к шагам, к усталости. Пусть это будет не критика, а забота.'
      },
      {
        sanskrit: 'कन्दर्प',
        translit: 'Kandarpa',
        meaning: 'бог любви',
        context: 'Кандарпа — персонификация любви и влечения, образ силы, которая движет миром.',
        thought: 'Любовь — это не только большое чувство, но и маленькие проявления: вовремя сказанное “спасибо”, чашка чая для близкого.'
      },
      {
        sanskrit: 'कोटि',
        translit: 'Koṭi',
        meaning: 'десятки миллионов, огромное множество',
        context: 'Этим словом подчёркивают бесконечность, неисчислимость — например, бесчисленные качества Господа.',
        thought: 'Не пытайся сегодня сделать всё. Вспомни это слово: “коти” — огромное множество. Пусть твой день будет про одно-два дела, но сделанных с вниманием.'
      },
      {
        sanskrit: 'कामनीय',
        translit: 'Kāmāniya',
        meaning: 'желанный, очаровательный',
        context: 'То, что притягивает взгляд и сердце, вызывает искреннее чувство.',
        thought: 'Что сегодня по-настоящему желанно твоему сердцу? Пусть это будет не про “надо”, а про “хочу”.'
      },
      {
        sanskrit: 'विशेष',
        translit: 'Viśeṣa',
        meaning: 'особый, исключительный',
        context: 'Этим словом выделяют что-то уникальное, то, что стоит особняком.',
        thought: 'Сегодня ты можешь сделать один маленький “вишеша”-шаг: не как обычно, а чуть лучше, чуть внимательнее.'
      },
      {
        sanskrit: 'शोभम्',
        translit: 'Śobham',
        meaning: 'красота, сияние',
        context: 'Сияние — не только свет, но и внутренняя сила, которая делает образ завершённым.',
        thought: 'Пусть сегодня твоё сияние — это спокойствие и доброе слово. Даже тихий свет виден в темноте.'
      },
      {
        sanskrit: 'गोविन्दम्',
        translit: 'Govindam',
        meaning: 'Говинда (имя Кришны)',
        context: 'Говинда — тот, кто радует коров и землю, образ милости и заботы о мире.',
        thought: 'Когда слышишь это имя, пусть оно напоминает: есть что-то большее, чем суета дня.'
      },
      {
        sanskrit: 'आदि',
        translit: 'Ādi',
        meaning: 'изначальный',
        context: 'Указывает на источник, начало, корень всего.',
        thought: 'Вспомни сегодня своё “ади” — то, с чего всё началось: первую книгу, первый урок, первую мысль, которая тебя вдохновила.'
      },
      {
        sanskrit: 'पुरुषम्',
        translit: 'Puruṣam',
        meaning: 'личность, Господь',
        context: 'Пуруша — не просто человек, а высшая Личность, источник всего.',
        thought: 'Сегодня пусть твоё внимание будет к людям: услышать, понять, поддержать.'
      },
      {
        sanskrit: 'तम्',
        translit: 'Tam',
        meaning: 'Его',
        context: 'Короткое слово, которое связывает нас с высшим: “Его милость”, “Его путь”.',
        thought: 'Пусть сегодня ты будешь не только про “я”, но и про “Его” — про что-то большее.'
      },
      {
        sanskrit: 'अहम्',
        translit: 'Aham',
        meaning: 'я (вечное “я”, не эго)',
        context: '«Aham ātmā…» — “Я — Атма, пребывающий в сердце каждого” (БГ 10.20).',
        thought: 'Когда говоришь “я”, вспомни не про эго, а про вечное внутри.'
      },
      {
        sanskrit: 'भजामि',
        translit: 'Bhajāmi',
        meaning: 'поклоняюсь, служу',
        context: 'Бхаджами — это не обязательно ритуал, а состояние сердца: служить с любовью и вниманием.',
        thought: 'Служение — это тоже про маленькие дела: поддержать, помочь, просто побыть рядом.'
      }
    ];

    const btn = document.getElementById('showBtn');
    const card = document.getElementById('wordCard');
    const sanskritEl = document.getElementById('sanskritWord');
    const translitEl = document.getElementById('translitWord');
    const meaningEl = document.getElementById('meaningWord');
    const contextEl = document.getElementById('contextWord');
    const thoughtEl = document.getElementById('thoughtWord');

    let currentIndex = 0;

    btn.addEventListener('click', () => {
      if (currentIndex >= words.length) {
        currentIndex = 0;
        alert('Прошли все слова первого куплета! Можно начать заново.');
      }
      const word = words[currentIndex];

      sanskritEl.textContent = word.sanskrit;
      translitEl.textContent = word.translit;
      meaningEl.textContent = word.meaning;
      contextEl.textContent = word.context;
      thoughtEl.textContent = word.thought;

      card.style.display = 'block';
      btn.textContent = 'Следующее слово';
      currentIndex++;
    });
  </script>
</body>
</html>
